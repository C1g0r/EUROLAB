name: Atualizar historico FDJ

on:
  schedule:
    # Noites dos sorteios e manhãs seguintes (UTC).
    - cron: '40 22 * * 2,5'
    - cron: '20 10 * * 3,6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: eurolab-fdj-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Testar o atualizador com ZIP local
        run: python3 tests/test_atualizador_fdj.py

      - name: Recolher e validar ZIP FDJ
        run: python3 scripts/atualizar_fdj.py

      - name: Revalidar histórico
        run: python3 tests/verificar_dados.py

      - name: Atualizar GitHub e republicar Pages quando houver novidades
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "eurolab-fdj-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dados-validados.json data/auditoria-financeira-v09.json
          git add data/relatorio-validacao.json data/historico-euromilhoes.csv
          if [ -f data/ultima-atualizacao-fdj.json ]; then git add data/ultima-atualizacao-fdj.json; fi
          if [ -d fontes/atualizacoes ]; then git add fontes/atualizacoes/; fi
          if git diff --cached --quiet; then
            echo "Sem novos sorteios: sem commit."
            exit 0
          fi
          last=$(python3 -c "import json; print(json.load(open('data/dados-validados.json'))['draws'][0]['date'])")
          git commit -m "data(fdj): acrescentar sorteios validados até $last"
          git push origin HEAD:main
          gh workflow run publicar-pages.yml --ref main
