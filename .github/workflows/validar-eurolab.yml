name: Validar EUROLAB

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript
        run: |
          node --check assets/app.js
          node --check assets/strategy.js
          node --check assets/comparacao-core.js
          node --check assets/comparacao.js
          node --check assets/crowd-core.js
          node --check assets/crowd.js
          node --check assets/selecao-core.js
          node --check assets/duas-chaves-core.js
          node --check assets/duas-chaves.js
      - name: Testar a geração de duas chaves
        run: node tests/duas-chaves.test.cjs
      - name: Testes da comparação
        run: node tests/comparacao.test.cjs
      - name: Testes do indicador de popularidade
        run: node tests/crowd.test.cjs
      - name: Reproduzir calibração das contagens de vencedores
        run: python3 scripts/popularidade_lab.py
      - name: Testar atualizador FDJ sem rede
        run: python3 tests/test_atualizador_fdj.py
      - name: Verificar histórico e JSON
        run: python3 tests/verificar_dados.py
