name: Publicar EUROLAB no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eurolab-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Preparar apenas os ficheiros públicos da aplicação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/data
          cp index.html painel-investigacao.html laboratorio-avancado.html _site/
          cp assets/*.js assets/*.css _site/assets/
          cp data/*.json data/*.csv _site/data/
          cp ARQUITETURA_FUTURA_WEBAPP.md RELATORIO_V08.md _site/
          touch _site/.nojekyll
          # Não publicar ZIP originais, scripts internos, testes, diários locais nem ficheiros Git.
          test -s _site/index.html
          test -s _site/assets/app.js
          test -s _site/assets/duas-chaves.js
          test -s _site/assets/duas-chaves-core.js
          test -s _site/assets/duas-chaves.css
          test -s _site/painel-investigacao.html
          test -s _site/data/dados-validados.json
          test ! -e _site/fontes

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
